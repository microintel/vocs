<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="manifest" href="manifest.json">
<title>VocCat</title>

<style>
*{
  box-sizing: border-box;
  margin:0;
  padding:0;
  font-family: 'Segoe UI', sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:center;
  background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
  color:white;
}

/* Title */
h1{
  margin-top:20px;
  font-size:28px;
  letter-spacing:1px;
  background: linear-gradient(90deg, #00f5a0, #00d9f5);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Center container */
.cent{
  width:100%;
  display:flex;
  justify-content:center;
}

/* Cards grid */
.fs{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  margin:30px 0;
  padding:10px;
}

/* Card style */
.f{
  width:150px;
  padding:20px;
  border-radius:16px;
  text-align:center;
  text-decoration:none;
  color:white;

  /* glass effect */
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.2);

  transition: all 0.3s ease;
}

/* Hover effect */
.f:hover{
  transform: translateY(-8px) scale(1.05);
  background: rgba(0,255,200,0.2);
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

/* Icon */
.i{
  font-size:40px;
}

/* Name */
.n{
  margin-top:10px;
  font-weight:bold;
  font-size:14px;
}

/* Image */
img{
  width:80%;
  max-width:350px;
  margin-bottom:20px;
  border-radius:12px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.5);
}
</style>
</head>

<body>

<h1> VocCat</h1>

<div class="cent">
  <div class="fs">

    <a href="api.html" class="f">
      <div class="i">📂</div>
      <div class="n">Search Word</div>
    </a>

    <a href="vocs.html" class="f">
      <div class="i">📚</div>
      <div class="n">Vigguu</div>
    </a>

    <a href="sentx.html" class="f">
      <div class="i">✍️</div>
      <div class="n">Sentences</div>
    </a>

    <a href="cat/index.html" class="f">
      <div class="i">🧠</div>
      <div class="n">Voc Category</div>
    </a>

    <a href="vinay/index.html" class="f">
      <div class="i">👨‍🏫</div>
      <div class="n">Mr Vinay</div>
    </a>

    <a href="vinay/mr_vinay_words_only.html" class="f">
      <div class="i">📖</div>
      <div class="n">Words Only</div>
    </a>

  </div>
</div>

<img src="https://raw.githubusercontent.com/microintel/endgram/main/photo/devloped%20by%20microintel%20game%20of%20thrones.png">

</html>
